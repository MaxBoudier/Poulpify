server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Le proxy Coolify (Traefik) termine le TLS en amont ; on lui fait
    # confiance pour les en-tetes X-Forwarded-*.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Application monopage : toute route inconnue retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Le service worker et le manifeste ne doivent jamais etre servis depuis
    # le cache navigateur, sinon une mise a jour peut ne jamais arriver.
    location ~* ^/(sw\.js|manifest\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Les assets Vite sont hashes : cache long sans risque.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Flux d'evenements : connexion longue duree. Les reglages par defaut du
    # bloc suivant la couperaient au bout de 30s et la bufferisation nginx
    # retiendrait les messages jusqu'a remplir un buffer.
    location = /api/events {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
    }

    # Backend : API, demarrage du flux OAuth Spotify et URL de retour.
    location ~ ^/(api/|login$|callback) {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
